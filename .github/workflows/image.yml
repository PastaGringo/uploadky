# Publishes the Docker image to GitHub's registry on every push to master, so a
# hosting panel can run uploadky without building it. The homeserver is a
# runtime setting (UPLOADKY_HOMESERVER_HTTP_BASE): one image serves any of them.
name: image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/pastagringo/uploadky:latest
            ghcr.io/pastagringo/uploadky:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
