# uploadky.
#
# Settings are baked at BUILD time (Vite inlines VITE_*), so a change here needs
# `up -d --build`, not just a restart. There is no runtime config endpoint: it
# blocked the first render on a round-trip for values that never change.
#
# No domain is baked in anywhere. Point a reverse proxy at this service; leave
# VITE_SHARE_BASE empty and the app uses its own origin, which is always right.

services:
  uploadky:
    build:
      context: .
      args:
        VITE_HOMESERVER_HTTP_BASE: ${VITE_HOMESERVER_HTTP_BASE:-https://homeserver.pubky.app}
        VITE_SHARE_BASE: ${VITE_SHARE_BASE:-}
        VITE_PUBKY_TESTNET: ${VITE_PUBKY_TESTNET:-false}
        VITE_PUBKY_TESTNET_HOST: ${VITE_PUBKY_TESTNET_HOST:-}
        VITE_PUBKY_HTTP_RELAY: ${VITE_PUBKY_HTTP_RELAY:-}
    restart: unless-stopped
    environment:
      # The redirect runs server-side, so this one IS a runtime value.
      UPLOADKY_HOMESERVER_HTTP_BASE: ${VITE_HOMESERVER_HTTP_BASE:-https://homeserver.pubky.app}

    # Published on loopback only: a reverse proxy fronts it.
    ports:
      - "127.0.0.1:${UPLOADKY_PORT:-8080}:8080"
